<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guntrader Stock</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Guntrader Stock</h1>

<div class="controls">
  <button id="btnUpload">Upload CSV</button>
  <button id="btnLowOnly">Low Stock Only</button>
  <button id="btnClear">Clear</button>
</div>

<input id="file" type="file" accept=".csv" hidden>

<div class="filters">
  <select id="makeFilter">
    <option value="">All Makes</option>
  </select>

  <select id="modelFilter">
    <option value="">All Models</option>
  </select>
</div>

<div class="stats">
  <div>Items: <span id="totalItems">0</span></div>
  <div>Makes: <span id="totalMakes">0</span></div>
  <div>Models: <span id="totalModels">0</span></div>
</div>

<div id="breakdown" class="breakdown"></div>

<script src="app.js"></script>
</body>
</html>
