<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>GUNTRADER STOCK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <div class="title">GUNTRADER STOCK</div>
    <div class="sub">New stock dashboard (Guntrader CSV)</div>
  </div>
</header>

<main class="wrap">

  <section class="card controls">

    <div class="btnrow">
      <button id="btnUpload" class="btn primary">Upload CSV</button>
      <button id="btnClear" class="btn">Clear CSV</button>
    </div>

    <input id="file" type="file" accept=".csv" hidden>

    <div class="filters">
      <select id="makeFilter">
        <option value="">All Makes</option>
      </select>

      <select id="modelFilter">
        <option value="">All Models</option>
      </select>
    </div>

    <button id="btnLowOnly" class="btn warn">Show Low Stock Only</button>

    <div class="stats">
      <div class="stat"><div class="k">New items</div><div class="v" id="statItems">0</div></div>
      <div class="stat"><div class="k">Makes</div><div class="v" id="statMakes">0</div></div>
      <div class="stat"><div class="k">Models</div><div class="v" id="statModels">0</div></div>
    </div>

    <div id="banner" class="banner hidden"></div>

    <input id="q" class="search" placeholder="Search make / model / calibre">

    <div class="legend">
      <span class="pill ok">3+ OK</span>
      <span class="pill warn">2 LOW</span>
      <span class="pill bad">1 LAST</span>
    </div>

  </section>

  <section class="card">
    <div class="section-title">Stock Breakdown — NEW only</div>
    <div id="list"></div>
    <div id="empty" class="empty hidden">Upload a Guntrader CSV to see stock levels.</div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
